<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>夕暮れの部屋 — Acrylic Star</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b21}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#f5f2e9}
  canvas{display:block;touch-action:none}
  button{font:inherit;cursor:pointer}
  #hud{
    position:fixed;top:22px;left:25px;pointer-events:none;
    text-shadow:0 2px 14px #000a;max-width:calc(100% - 40px)
  }
  #hud small{font-size:10px;letter-spacing:.25em;color:#dad8ce}
  #hud h1{font-size:23px;font-weight:500;letter-spacing:.13em;margin:8px 0}
  #objective{font-size:12px;color:#e1e1d7;line-height:1.8}
  #help{margin-top:8px;font-size:11px;color:#c2c7c8}
  #nav{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;padding:7px;border:1px solid #ffffff23;
    border-radius:15px;background:#192024bd;backdrop-filter:blur(16px);
    max-width:96vw;overflow-x:auto
  }
  #nav button,#back{
    border:1px solid #ffffff13;background:#ffffff09;color:#e8e6dd;
    border-radius:9px;padding:10px 14px;white-space:nowrap;font-size:12px;
    transition:background .2s
  }
  #nav button:hover,#back:hover{background:#ffffff23}
  #nav button.active{background:#ded8b82b;border-color:#ded8b858}
  #back{position:fixed;right:22px;top:22px;display:none;background:#152023d9}
  #tip{
    position:fixed;left:50%;bottom:103px;transform:translateX(-50%);
    background:#121b21c7;padding:10px 18px;border-radius:30px;
    font-size:12px;pointer-events:none;text-align:center;max-width:90vw;
    opacity:0;transition:opacity .2s;backdrop-filter:blur(10px)
  }
  #toast{
    position:fixed;top:115px;left:50%;transform:translate(-50%,-7px);
    padding:13px 22px;background:#eee9dadf;color:#38372e;
    border:1px solid #fff7;border-radius:9px;font-size:12px;
    line-height:1.7;opacity:0;transition:.3s;pointer-events:none;
    max-width:86vw;text-align:center
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #loading{
    position:fixed;inset:0;z-index:30;display:grid;place-content:center;
    background:#192026;text-align:center;line-height:2.2;font-size:13px
  }
  #loading span{font-size:10px;letter-spacing:.3em;color:#b6bcb9}
  #paperModal{
    position:fixed;inset:0;z-index:20;display:none;
    background:#080d14bd;backdrop-filter:blur(7px);padding:28px 14px;
    overflow:auto
  }
  #paperSheet{
    max-width:710px;margin:auto;background:#eee9d9;color:#35352f;
    padding:45px 48px;box-shadow:0 16px 90px #0008;
    background-image:repeating-linear-gradient(0deg,#00000002 0 1px,transparent 1px 3px)
  }
  #paperSheet .stamp{font:10px monospace;letter-spacing:.18em;color:#797a6f}
  #paperSheet h2{font-size:22px;font-weight:500;margin:22px 0}
  #paperText{font-size:14px;line-height:2.1;white-space:pre-wrap}
  #closePaper{
    float:right;border:1px solid #79796b;background:none;
    color:#4a4b40;padding:7px 13px;border-radius:4px
  }
  #win{
    position:fixed;inset:0;z-index:15;display:none;place-content:center;
    text-align:center;background:#07171c7a;backdrop-filter:blur(9px);
    padding:25px
  }
  #win small{letter-spacing:.3em;color:#b5e7e4}
  #win h2{font-size:36px;font-weight:400;letter-spacing:.13em}
  #win p{font-size:13px;line-height:2;color:#e0e9e5}
  #win button{
    margin:20px auto 0;padding:12px 24px;background:#e9eee6;
    border:0;border-radius:7px;color:#234049
  }
  @media(max-width:600px){
    #hud{top:17px;left:17px} #hud h1{font-size:19px}
    #nav{bottom:13px;gap:4px}
    #nav button{padding:10px 11px;font-size:11px}
    #paperSheet{padding:27px 23px} #help{font-size:10px}
    #back{top:17px;right:13px;font-size:11px;padding:9px}
  }
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">部屋に光を入れています…<br><span>ACRYLIC STAR</span></div>

<div id="hud">
  <small>AN EVENING ROOM / EXPLORATION</small>
  <h1>夕暮れの部屋</h1>
  <div id="objective">この部屋のどこかにある、アクリルのスターを探す。</div>
  <div id="help">WASD：移動　／　ドラッグ：見回す　／　クリック：調べる　／　下：視点移動</div>
</div>

<div id="nav">
  <button data-view="room" class="active">部屋</button>
  <button data-view="desk">机</button>
  <button data-view="closet">クローゼット</button>
  <button data-view="bed">ベッド</button>
  <button data-view="under">ベッドの下</button>
  <button data-view="switch">スイッチ</button>
</div>
<button id="back">部屋に戻る ↩</button>
<div id="tip"></div>
<div id="toast"></div>

<div id="paperModal">
  <article id="paperSheet">
    <button id="closePaper">閉じる ×</button>
    <div class="stamp">PRIVATE / DEVELOPMENT MEMO / 01</div>
    <h2>この部屋のコードについて</h2>
    <div id="paperText"></div>
  </article>
</div>

<div id="win">
  <small>FOUND / ACRYLIC STAR</small>
  <h2>星を、見つけた。</h2>
  <p>茶色いポーチの中で、<br>小さなアクリルの縁が光を拾っていた。</p>
  <button id="continue">そのまま部屋を眺める</button>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = THREE.MathUtils.clamp;
const lerp = THREE.MathUtils.lerp;

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#202932');
scene.fog = new THREE.FogExp2('#36434b', .009);

const inspectScene = new THREE.Scene();
inspectScene.background = new THREE.Color('#202c31');

const pmrem = new THREE.PMREMGenerator(renderer);
const envRoom = new RoomEnvironment();
const envRT = pmrem.fromScene(envRoom, .045);
envRoom.dispose();
pmrem.dispose();
scene.environment = envRT.texture;
scene.environmentIntensity = .20;
inspectScene.environment = envRT.texture;
inspectScene.environmentIntensity = .85;

const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.025,35);
const inspectCamera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.025,20);
inspectCamera.position.set(0,.54,2.4);
inspectCamera.lookAt(0,.43,0);

let mode = 'room', currentView = 'room';
let roomLightOn = true, lightAmount = 1, lightOffAge = 9;
let drawerOpen = false, closetOpen = false, pouchOpen = false, found = false;
let lampOn = true;
let paperVisible = false;
let toastTimer;
let time = 0;
const tweens = [];

function toast(text,ms=3000){
  $('#toast').textContent=text;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),ms);
}
function animateTo(obj, values, duration=.65, complete){
  // 同じプロパティを操作する古い補間を取り除く。
  for(let i=tweens.length-1;i>=0;i--){
    if(tweens[i].obj===obj &&
       Object.keys(values).some(k=>k in tweens[i].to)) tweens.splice(i,1);
  }
  const from={};
  for(const k in values) from[k]=obj[k];
  tweens.push({obj,from,to:values,t:0,duration,complete});
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const a=tweens[i]; a.t+=dt;
    const k=Math.min(1,a.t/a.duration);
    const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    for(const p in a.to) a.obj[p]=lerp(a.from[p],a.to[p],e);
    if(k===1){tweens.splice(i,1);a.complete?.();}
  }
}
function actionable(obj,label,fn){
  obj.userData.action=fn;
  obj.userData.label=label;
  return obj;
}
function group(parent=scene){
  const g=new THREE.Group(); parent.add(g); return g;
}
function material(color,roughness=.6,metalness=0,extra={}){
  return new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
}
function mesh(geo,mat,parent=scene,x=0,y=0,z=0){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  parent.add(m); return m;
}
function box(w,h,d,mat,parent=scene,x=0,y=0,z=0){
  return mesh(new THREE.BoxGeometry(w,h,d),mat,parent,x,y,z);
}
function cylinder(r1,r2,h,mat,parent=scene,x=0,y=0,z=0,segments=32){
  return mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat,parent,x,y,z);
}
function sphere(r,mat,parent,x=0,y=0,z=0){
  return mesh(new THREE.SphereGeometry(r,24,16),mat,parent,x,y,z);
}
function tube(points,r,mat,parent,closed=false){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)),closed);
  return mesh(new THREE.TubeGeometry(curve,Math.max(16,points.length*7),r,7,closed),mat,parent);
}
function canvasTexture(draw,size=512){
  const c=document.createElement('canvas');c.width=c.height=size;
  draw(c.getContext('2d'),size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
let seed=9173;
function random(){
  seed=(1664525*seed+1013904223)>>>0;
  return seed/4294967296;
}
function tiled(t,x,y){
  const a=t.clone();a.wrapS=a.wrapT=THREE.RepeatWrapping;
  a.repeat.set(x,y);a.needsUpdate=true;return a;
}

const woodTexture=canvasTexture((c,s)=>{
  c.fillStyle='#896649';c.fillRect(0,0,s,s);
  for(let i=0;i<2500;i++){
    const y=random()*s,a=.02+random()*.10;
    c.strokeStyle=`rgba(${random()>.4?'48,26,11':'237,198,139'},${a})`;
    c.lineWidth=.3+random()*1.4;c.beginPath();
    for(let x=0;x<=s;x+=12){
      const yy=y+Math.sin(x*.012+y*.018)*2.5+Math.sin(x*.035+y)*.7;
      x?c.lineTo(x,yy):c.moveTo(x,yy);
    }
    c.stroke();
  }
  for(let i=0;i<7;i++){
    const x=random()*s,y=random()*s;
    for(let j=0;j<12;j++){
      c.strokeStyle=`rgba(42,23,12,${.10-j*.006})`;
      c.beginPath();c.ellipse(x,y,9+j*6,1.3+j*1.3,.04,0,TAU);c.stroke();
    }
  }
});
const floorTexture=canvasTexture((c,s)=>{
  c.fillStyle='#a17b55';c.fillRect(0,0,s,s);
  const rows=8,h=s/rows;
  for(let r=0;r<rows;r++){
    c.save();c.beginPath();c.rect(0,r*h,s,h);c.clip();
    c.globalAlpha=.86;c.drawImage(woodTexture.image,0,r*h,s,h);
    c.globalAlpha=1;
    c.fillStyle=`rgba(${r%3?'18,8,0':'245,218,179'},.09)`;
    c.fillRect(0,r*h,s,h);
    c.fillStyle='#49372b';c.fillRect(0,r*h,s,.9);
    c.fillStyle='#d0af85';c.fillRect(0,r*h+1,s,.7);
    const offset=(r%3)*s/3;
    c.fillStyle='#594331';c.fillRect(offset,r*h,1,h);
    c.restore();
  }
},1024);
const wallpaperTexture=canvasTexture((c,s)=>{
  c.fillStyle='#d8d3c2';c.fillRect(0,0,s,s);
  for(let i=0;i<40000;i++){
    c.fillStyle=random()>.5?'#ffffff0b':'#4944350a';
    c.fillRect(random()*s,random()*s,1,1.5);
  }
  for(let x=0;x<s;x+=32){
    c.fillStyle='#aca89813';c.fillRect(x,0,2,s);
    for(let y=16;y<s;y+=64){
      c.strokeStyle='#99998519';c.lineWidth=.8;c.beginPath();
      c.ellipse(x+16,y,4,10,0,0,TAU);c.stroke();
    }
  }
});
const weaveTexture=canvasTexture((c,s)=>{
  c.fillStyle='#c9c3b4';c.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=4){
    c.strokeStyle=y%8?'#a6a18f':'#e3ddcd';c.lineWidth=1;
    c.beginPath();c.moveTo(0,y);c.lineTo(s,y);c.stroke();
  }
  for(let x=0;x<s;x+=3){
    c.strokeStyle=x%6?'#fff2':'#39342633';
    c.beginPath();c.moveTo(x,0);c.lineTo(x,s);c.stroke();
  }
  for(let i=0;i<9000;i++){
    c.fillStyle=random()>.5?'#fff2':'#0001';
    c.fillRect(random()*s,random()*s,1,2);
  }
});
const leatherTexture=canvasTexture((c,s)=>{
  c.fillStyle='#71472e';c.fillRect(0,0,s,s);
  for(let i=0;i<42000;i++){
    const x=random()*s,y=random()*s,r=.3+random()*1.25;
    c.fillStyle=random()>.48?'#2e180c35':'#d7a57625';
    c.beginPath();c.ellipse(x,y,r,r*.65,random()*3,0,TAU);c.fill();
  }
  for(let i=0;i<450;i++){
    const x=random()*s,y=random()*s;
    c.strokeStyle='#2413081b';c.lineWidth=.6;c.beginPath();
    c.moveTo(x,y);c.lineTo(x+random()*12-6,y+random()*7);c.stroke();
  }
});
const pagesTexture=canvasTexture((c,s)=>{
  c.fillStyle='#e1d9c5';c.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=2){
    c.fillStyle=`rgba(76,61,42,${.03+random()*.15})`;
    c.fillRect(0,y,s,.5+random());
  }
});

const wood=material('#d1ac80',.42,0,{map:woodTexture,bumpMap:woodTexture,bumpScale:.008});
const darkWood=material('#867156',.48,0,{map:woodTexture,bumpMap:woodTexture,bumpScale:.008});
const wall=material('#fff9ee',.96,0,{
  map:tiled(wallpaperTexture,4,2),bumpMap:tiled(wallpaperTexture,4,2),bumpScale:.005
});
const trim=material('#dfdcd0',.5);
const black=material('#171b1d',.42);
const steel=material('#b7bec0',.25,.82);
const brass=material('#b99451',.28,.72);
const plastic=new THREE.MeshPhysicalMaterial({
  color:'#eeeadd',roughness:.23,metalness:0,clearcoat:.7,clearcoatRoughness:.17
});
const fabric=material('#e2d5b5',.98,0,{map:tiled(weaveTexture,4,4),bumpMap:tiled(weaveTexture,4,4),bumpScale:.008});
const leather=material('#b28765',.63,0,{
  map:leatherTexture,bumpMap:leatherTexture,bumpScale:.009
});
const stitchMat=material('#c8aa78',.93);

// 部屋。前面の壁も含めた、内部から眺める箱。
box(8,.16,8,material('#ffffff',.51,0,{
  map:tiled(floorTexture,3,3),bumpMap:tiled(floorTexture,3,3),bumpScale:.013
}),scene,0,-.08,0);
box(8,3.25,.14,wall,scene,0,1.625,-4.07);
// 右壁に本当の開口を作る。ドアの幅は1.02m。
box(.14,3.25,5.99,wall,scene,4.07,1.625,-1.005);
box(.14,3.25,.99,wall,scene,4.07,1.625,3.505);
box(.14,.89,1.02,wall,scene,4.07,2.805,2.5);
box(8,3.25,.14,wall,scene,0,1.625,4.07);
box(8,.12,8,material('#e5e1d6',.94),scene,0,3.31,0);

// 窓のある左壁は、窓の部分を本当に開けておく。
box(.14,3.25,2.85,wall,scene,-4.07,1.625,-2.575);
box(.14,3.25,2.85,wall,scene,-4.07,1.625,2.575);
box(.14,.62,2.3,wall,scene,-4.07,.31,0);
box(.14,.33,2.3,wall,scene,-4.07,3.085,0);
box(.045,.14,8,trim,scene,-3.985,.07,0);
box(.045,.14,5.99,trim,scene,3.985,.07,-1.005);
box(.045,.14,.99,trim,scene,3.985,.07,3.505);
for(const z of [-3.985,3.985]) box(8,.14,.045,trim,scene,0,.07,z);

// 外の夕空。
const skyTexture=canvasTexture((c,s)=>{
  const g=c.createLinearGradient(0,0,0,s);
  g.addColorStop(0,'#233c62');g.addColorStop(.58,'#8ba1b0');
  g.addColorStop(1,'#dec2a4');c.fillStyle=g;c.fillRect(0,0,s,s);
  for(let i=0;i<26;i++){
    const x=random()*s,h=30+random()*100;
    c.fillStyle=i%2?'#485969':'#566473';c.fillRect(x,s-h,20+random()*40,h);
  }
});
const sky=mesh(new THREE.PlaneGeometry(4,4),new THREE.MeshBasicMaterial({map:skyTexture}),scene,-4.6,1.8,0);
sky.rotation.y=Math.PI/2;

const windowFrame=group();
windowFrame.position.set(-3.99,1.76,0);windowFrame.rotation.y=Math.PI/2;
for(const x of [-1.16,1.16]) box(.075,2.38,.11,trim,windowFrame,x,0,0);
for(const y of [-1.17,1.17]) box(2.4,.075,.11,trim,windowFrame,0,y,0);
box(.055,2.3,.08,trim,windowFrame);
box(2.3,.045,.08,trim,windowFrame,0,.15,0);
box(2.5,.055,.27,trim,windowFrame,0,-1.19,.07);
mesh(new THREE.PlaneGeometry(2.27,2.26),new THREE.MeshPhysicalMaterial({
  color:'#d6e4e8',transparent:true,opacity:.16,roughness:.08,
  metalness:.08,side:THREE.DoubleSide,depthWrite:false
}),windowFrame,0,0,-.04);

// カーテン。裾ほどよく揺れ、複数の非同期の波で周期感を薄める。
const curtainMat=material('#e8dfc7',.98,0,{
  map:tiled(weaveTexture,5,7),bumpMap:tiled(weaveTexture,5,7),bumpScale:.007,
  side:THREE.DoubleSide
});
const curtains=[];
for(const side of [-1,1]){
  const geo=new THREE.PlaneGeometry(.84,2.38,30,44);
  const m=mesh(geo,curtainMat,scene,-3.77,1.69,side*.88);
  m.rotation.y=Math.PI/2;
  curtains.push({m,base:new Float32Array(geo.attributes.position.array),side});
}
cylinder(.021,.021,2.9,steel,scene,-3.69,2.98,0).rotation.x=Math.PI/2;
for(let i=0;i<18;i++){
  const z=-1.3+i*2.6/17;
  const ring=mesh(new THREE.TorusGeometry(.035,.006,8,20),steel,scene,-3.69,2.96,z);
  // トーラスの穴をカーテンレールの軸に合わせる。
  ring.rotation.y=0;
}

// 天井灯。
const ceilingLightBody=group();
ceilingLightBody.position.set(0,3.18,-.15);
cylinder(.34,.4,.07,plastic,ceilingLightBody);
const diffuserMat=new THREE.MeshStandardMaterial({
  color:'#fff1d8',roughness:.56,emissive:'#ffe5b5',emissiveIntensity:1.2
});
cylinder(.37,.37,.025,diffuserMat,ceilingLightBody,0,-.046,0);
cylinder(.09,.09,.06,steel,ceilingLightBody,0,.06,0);

const mainLight=new THREE.PointLight('#fff0d3',38,12,2);
mainLight.position.set(0,2.93,-.15);
mainLight.castShadow=true;
mainLight.shadow.mapSize.set(1024,1024);
mainLight.shadow.bias=-.00045;
mainLight.shadow.normalBias=.025;
mainLight.shadow.camera.near=.1;
mainLight.shadow.camera.far=13;
scene.add(mainLight);

const fillLight=new THREE.HemisphereLight('#b4c9e0','#423222',.23);
scene.add(fillLight);
const windowLight=new THREE.SpotLight('#b7d0f2',32,13,.76,.72,1.8);
windowLight.position.set(-3.75,2.5,0);
windowLight.target.position.set(1,.25,.8);
windowLight.castShadow=true;
windowLight.shadow.mapSize.set(1024,1024);
windowLight.shadow.normalBias=.025;
scene.add(windowLight,windowLight.target);

// ドアと金具。蝶番を原点にして内側へ開く。
const doorGroup=group();
doorGroup.position.set(3.975,0,2.5);
doorGroup.rotation.y=-Math.PI/2;
for(const x of [-.55,.55]) box(.09,2.45,.11,trim,doorGroup,x,1.225,0);
box(1.19,.09,.11,trim,doorGroup,0,2.44,0);

const roomDoorLeaf=group(doorGroup);
roomDoorLeaf.position.x=.51;
const roomDoorPanel=group(roomDoorLeaf);
roomDoorPanel.position.x=-.51;

box(1.02,2.35,.055,darkWood,roomDoorPanel,0,1.19,0);
for(const y of [.65,1.72]){
  box(.78,.78,.015,wood,roomDoorPanel,0,y,.038);
  for(const x of [-.405,.405]){
    box(.025,.84,.025,darkWood,roomDoorPanel,x,y,.054);

const memo=`これは架空の開発メモです。部屋を作った「開発者」という登場人物の、どうでもいい愚痴が印刷されています。

正直に書く。この部屋のコード書くの、だるかった。最初は「机を置いて、星を隠せば完成だな」と思っていた。どうして机の木目の向きと、引き出しの内側の板の厚みについて、こんなに真剣になる必要があったんだろう。星を探すゲームなのに、気がつけば木材のことを考えている。

本もそうだ。四角い箱を積めば本に見えると思った。ところが、表紙には厚みが必要で、紙の断面には細い線が必要で、背表紙には文字が必要だった。誰だ、本を小物と呼んだのは。小物の顔をした大仕事じゃないか。しかも、その本をどかせるようにした。机の上を片付ける機能まで作るとは聞いていない。いや、聞いていた。

照明はもっとひどい。「消す」とは、明るさをゼロにすることだと信じていた。でも、それでは味気ない。ほんの一瞬、部屋が淡い暖色に包まれて、それから余熱みたいに光が抜けていく。その一瞬のために、色と明るさを別々に動かしている。誰か、このこだわりを褒めてほしい。スイッチを十回ぐらい押してもいい。ただし、目は大切にしてほしい。

カーテンは、そよそよしていればいいわけではなかった。全部が同じ周期で動くと、風というより体操になる。上の方はほとんど止めて、裾だけ少し遅らせて、違う速さの波を重ねた。布の陰影を見ているうちに、星のことを忘れそうになった。もうカーテン鑑賞ゲームでよくないか。よくない。

クローゼットを開けたら服がある。当たり前だ。けれど、この世界の当たり前は、全部こちらで配置しなければ存在しない。ハンガーの曲がったフック、服の襟、ポケット、縫い目。さらに一枚ずつ床に置ける。片付いた部屋を作るのに苦労して、散らかす機能にも苦労している。これはいったい何の循環なんだろう。

ベッドの下も作った。普通なら見えない場所だ。でも潜れる以上、見えないという言い訳はできない。すのこ、脚、少しの埃。低い視点になると、いつもの部屋が妙に広く感じる。そこだけは、ちょっと気に入っている。床に近い空気まで想像してもらえたら、苦労した意味がある。

そしてポーチ。茶色い入れ物、と一言で済ませられるのが本当にずるい。革の粒、縫い糸、端のパイピング、金属の留め金。回せるということは、裏も作るということだ。裏側を見た人には、心の中で小さく拍手を送ることにする。これは開発者役の台詞なので、実際にどこかで拍手が発生するわけではない。

最後に、アクリル。ガラスほど冷たくなく、プラスチックという言葉だけでは説明しきれない、透明な厚み。星の縁に光が集まるところだけは、雑にしたくなかった。たぶん、この部屋は、その小さな光のためにある。

……というわけで、愚痴はここまで。紙には星の場所を直接は書かない。ただ、探し物が見つからないときは、普段より少し目線を下げるといい。机の上ばかり見ていても、見えないものはある。

追伸。この長文を印刷して引き出しにしまったのは誰なんだろう。そこは、あまり深く考えないでほしい。`;

function wrapText(ctx,text,maxWidth){
  const lines=[];
  for(const paragraph of text.split('\n')){
    let line='';
    for(const ch of paragraph){
      if(ctx.measureText(line+ch).width>maxWidth && line){
        lines.push(line);line=ch;
      }else line+=ch;
    }
    lines.push(line);
  }
  return lines;
}

function createStar(parent){
  const starShape=new THREE.Shape();
  for(let i=0;i<10;i++){
    const a=Math.PI/2+i*Math.PI/5;
    const r=i%2?.127:.285;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;
    i?starShape.lineTo(x,y):starShape.moveTo(x,y);
  }
  starShape.closePath();
  const hole=new THREE.Path();
  hole.absarc(0,.213,.015,0,TAU,true);
  starShape.holes.push(hole);
  const geo=new THREE.ExtrudeGeometry(starShape,{
    depth:.058,bevelEnabled:true,bevelSegments:4,
    bevelThickness:.009,bevelSize:.007,curveSegments:24,steps:1
  });
  geo.translate(0,0,-.029);
  const acrylic=new THREE.MeshPhysicalMaterial({
    color:'#b6e8e2',metalness:0,roughness:.065,
    transmission:.96,thickness:.11,ior:1.49,
    attenuationColor:'#60cbc5',attenuationDistance:.75,
    clearcoat:1,clearcoatRoughness:.07,envMapIntensity:1.75
  });
  const star=mesh(geo,acrylic,parent);
  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo,28),
    new THREE.LineBasicMaterial({color:'#d8ffff',transparent:true,opacity:.19}));
  star.add(edge);
  return star;
}
function roundedShape(w,h,r){
  const s=new THREE.Shape(),x=-w/2;
  s.moveTo(x+r,0);s.lineTo(x+w-r,0);
  s.quadraticCurveTo(x+w,0,x+w,r);s.lineTo(x+w,h-r);
  s.quadraticCurveTo(x+w,h,x+w-r,h);s.lineTo(x+r,h);
  s.quadraticCurveTo(x,h,x,h-r);s.lineTo(x,r);
  s.quadraticCurveTo(x,0,x+r,0);return s;
}

function roomRandom(index){
  let s=(0x9e3779b9 ^ Math.imul(index+1,2654435761))>>>0;
  return ()=>{
    s=(Math.imul(s,1664525)+1013904223)>>>0;

}

function applyRoomLayout(index){
  for(const saved of wardrobeStorage){
    const object=saved.object;
    // 床へ置いている途中の補間も止める。
    for(let i=tweens.length-1;i>=0;i--){
      if(tweens[i].obj===object.position || tweens[i].obj===object.rotation){
        tweens.splice(i,1);
      }
    }
    wardrobe.add(object);
    object.position.copy(saved.position);
    object.quaternion.copy(saved.quaternion);
    object.scale.copy(saved.scale);
    object.userData.removed=false;
  }
  droppedCount=0;

  const roots=[deskLayoutRoot,wardrobeLayoutRoot,bedLayoutRoot];
  for(const root of roots){
    root.position.set(0,0,0);
    root.rotation.set(0,0,0);
  }

  if(index!==0){
    const rng=roomRandom(index);
    // 各区画の中心間隔は3.9m。
    // 最大の家具セットも半幅1.7m以内なので、区画同士は重ならない。
    // 南東の区画はドアへのアクセスのため、必ず空ける。
    const slots=[
      {x:-1.95,z:-1.95,angles:[0,Math.PI/2]},
      {x: 1.95,z:-1.95,angles:[0,-Math.PI/2]},
      {x:-1.95,z: 1.95,angles:[Math.PI,Math.PI/2]}
    ];
    for(let i=slots.length-1;i>0;i--){
      const j=Math.floor(rng()*(i+1));
      [slots[i],slots[j]]=[slots[j],slots[i]];
    }

    const bundles=[
      {root:deskLayoutRoot,center:new THREE.Vector3(-2.55,0,-2.03)},
      {root:wardrobeLayoutRoot,center:new THREE.Vector3(.12,0,-3.02)},
      {root:bedLayoutRoot,center:new THREE.Vector3(1.89,0,-1.32)}
    ];

    bundles.forEach((bundle,i)=>{
      const slot=slots[i];
      const angle=slot.angles[Math.floor(rng()*slot.angles.length)];
      const rotated=bundle.center.clone().applyAxisAngle(
        new THREE.Vector3(0,1,0),angle
      );
      bundle.root.rotation.y=angle;
      bundle.root.position.set(
        slot.x-rotated.x+(rng()-.5)*.025,
        0,
        slot.z-rotated.z+(rng()-.5)*.025
      );
    });
  }

  // 衣類の置き場所は空いている南東区画内。
  // 長い服も互いに重なりにくい間隔で、入口の正面は避ける。
  for(let i=0;i<floorSlots.length;i++){
    floorSlots[i].set(
      .72+(i%4)*.62,
      .08,
      1.18+Math.floor(i/4)*1.12
    );
  }
  scene.updateMatrixWorld(true);
}

    t:root.localToWorld(new THREE.Vector3(...source.t)).toArray()
  };

let yaw=0,pitch=0,cameraTravel=null;
function anglesFor(pos,target){
  const d=new THREE.Vector3(...target).sub(new THREE.Vector3(...pos)).normalize();
  return {yaw:Math.atan2(-d.x,-d.z),pitch:Math.asin(d.y)};
}
function applyLook(){
  camera.rotation.order='YXZ';
  camera.rotation.set(pitch,yaw,0);
}
function gotoView(name,instant=false){
  if(mode==='corridor'){
    toast('廊下ではWASDで移動。ドアから部屋へ入ると、家具の視点ボタンを使える。');
    return;

  currentView=name;
  const v=transformedView(name),a=anglesFor(v.p,v.t);
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(instant){
    camera.position.fromArray(v.p);yaw=a.yaw;pitch=a.pitch;applyLook();
  }else{
    let targetYaw=a.yaw;
    while(targetYaw-yaw>Math.PI)targetYaw-=TAU;
    while(targetYaw-yaw<-Math.PI)targetYaw+=TAU;
    cameraTravel={
      start:camera.position.clone(),end:new THREE.Vector3(...v.p),
      yaw0:yaw,yaw1:targetYaw,pitch0:pitch,pitch1:a.pitch,t:0,
      duration:name==='under'?1.35:.95
    };
    if(name==='under')toast('身をかがめて、ベッドの下へ。床の近くに、茶色いものがある。',3500);
  }
}

// WASD：視線の上下角には影響されず、床と平行に移動する。
const movementKeys=new Set();
const movementCodes=new Set(['KeyW','KeyA','KeyS','KeyD']);
const playerRadius=.16;

function movementBlockedByUI(){
  return (mode!=='room' && mode!=='corridor') ||
    paperVisible || $('#win').style.display==='grid';
}

addEventListener('keydown',e=>{
  if(!movementCodes.has(e.code))return;
  const target=e.target;
  if(target instanceof HTMLElement &&
     (target.isContentEditable ||
      ['INPUT','TEXTAREA','SELECT'].includes(target.tagName)))return;
  if(movementBlockedByUI())return;
  e.preventDefault();
  movementKeys.add(e.code);
});
addEventListener('keyup',e=>{
  movementKeys.delete(e.code);
});
addEventListener('blur',()=>movementKeys.clear());
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)movementKeys.clear();
});

function circleIntersectsBox(x,z,rect){
  const closestX=clamp(x,rect.minX,rect.maxX);
  const closestZ=clamp(z,rect.minZ,rect.maxZ);
  return (x-closestX)**2+(z-closestZ)**2<playerRadius**2;
}

function collidesWithDoorPanel(panel,x,z,eyeY){
  if(!panel)return false;
  panel.updateWorldMatrix(true,false);
  const p=panel.worldToLocal(new THREE.Vector3(x,eyeY,z));
  return circleIntersectsBox(p.x,p.z,{
    minX:-.51,maxX:.51,minZ:-.075,maxZ:.075
  });
}

function canWalkAt(x,z,eyeY){
  if(mode==='corridor')return canWalkCorridor(x,z,eyeY);

  const doorway=doorOpen && roomDoorLeaf.rotation.y>1.05 &&
    Math.abs(z-2.5)<.51-playerRadius-.025 &&
    x>3.55 && x<4.5;

  if(z < -3.96+playerRadius || z > 3.96-playerRadius ||
     x < -3.96+playerRadius)return false;
  if(x>3.96-playerRadius && !doorway)return false;

  const headY=eyeY+.09;
  function bundleCollision(root,rectangles){
    root.updateWorldMatrix(true,false);
    const local=root.worldToLocal(new THREE.Vector3(x,eyeY,z));
    return rectangles.some(rect=>
      headY>(rect.minY||0) &&
      circleIntersectsBox(local.x,local.z,rect)
    );
  }

  const deskObstacles=[
    {minX:-3.65,maxX:-1.45,minZ:-3.43,maxZ:-2.37},
    {
      minX:chair.position.x-.35,maxX:chair.position.x+.35,
      minZ:chair.position.z-.34,maxZ:chair.position.z+.34
    },
    {
      minX:trash.position.x-.19,maxX:trash.position.x+.19,
      minZ:trash.position.z-.19,maxZ:trash.position.z+.19
    }
  ];
  if(drawer.position.z>.08){
    deskObstacles.push({
      minX:-3.025,maxX:-1.975,
      minZ:-2.9+drawer.position.z-.43,
      maxZ:-2.9+drawer.position.z+.48,minY:.59
    });
  }
  if(bundleCollision(deskLayoutRoot,deskObstacles))return false;

  if(bundleCollision(wardrobeLayoutRoot,[
    {minX:-.78,maxX:1.02,minZ:-3.90,maxZ:-2.94}
  ]))return false;

  const bedObstacles=[
    {minX:1.28,maxX:3.30,minZ:-2.89,maxZ:.25,minY:.49},
    {minX:1.25,maxX:3.33,minZ:-2.96,maxZ:-2.84}
  ];
  for(const lx of [-.86,.86]){
    for(const lz of [-1.39,1.39]){
      bedObstacles.push({
        minX:bed.position.x+lx-.055,maxX:bed.position.x+lx+.055,
        minZ:bed.position.z+lz-.055,maxZ:bed.position.z+lz+.055
      });
    }
  }
  if(bundleCollision(bedLayoutRoot,bedObstacles))return false;

  for(const [door,sign] of [[leftDoor,1],[rightDoor,-1]]){
    door.updateWorldMatrix(true,false);
    const local=door.worldToLocal(new THREE.Vector3(x,eyeY,z));
    const centerX=sign*cw/4;
    const halfWidth=(cw/2-.025)/2;
    if(circleIntersectsBox(local.x,local.z,{
      minX:centerX-halfWidth,maxX:centerX+halfWidth,
      minZ:-.035,maxZ:.078
    }))return false;
  }

  if(collidesWithDoorPanel(roomDoorPanel,x,z,eyeY))return false;
  return true;
}

function updateWalking(dt){
  if(movementBlockedByUI()){
    movementKeys.clear();
    return;
  }

  const forward=Number(movementKeys.has('KeyW'))-Number(movementKeys.has('KeyS'));
  const sideways=Number(movementKeys.has('KeyD'))-Number(movementKeys.has('KeyA'));
  if(!forward && !sideways)return;

  // 視点移動アニメーション中でも、キー入力を優先する。
  cameraTravel=null;

  const speed=currentView==='under'?.65:1.65;
  const distance=speed*dt/Math.hypot(forward,sideways);
  const dx=(-Math.sin(yaw)*forward+Math.cos(yaw)*sideways)*distance;
  const dz=(-Math.cos(yaw)*forward-Math.sin(yaw)*sideways)*distance;

  // 小分けに移動し、薄い障害物のすり抜けを防ぐ。
  // X/Zを別々に判定することで、壁沿いには滑らかに歩ける。
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.025));
  for(let i=0;i<steps;i++){
    const nextX=camera.position.x+dx/steps;
    if(canWalkAt(nextX,camera.position.z,camera.position.y)){
      camera.position.x=nextX;
    }
    const nextZ=camera.position.z+dz/steps;
    if(canWalkAt(camera.position.x,nextZ,camera.position.y)){
      camera.position.z=nextZ;
    }
  }

  updateAreaCrossing();

  // 手動移動後は「固定視点にいる」という表示だけ外す。
  document.querySelectorAll('#nav button.active').forEach(b=>{
    b.classList.remove('active');
  });
}

// 廊下は直線、左折、右折、突き当たりの折り返しを持つ反復区間。
// 区間端の直線部分で座標を巻き戻すため、曲がり角の形を保って循環する。
const corridorScene=new THREE.Scene();
corridorScene.background=new THREE.Color('#242b2e');
corridorScene.environment=envRT.texture;
corridorScene.environmentIntensity=.19;
corridorScene.fog=new THREE.Fog('#343c3c',13,31);

const HALL_CELL=.5;
const HALL_PERIOD=32;
const hallCells=new Set();
const hallKey=(x,z)=>`${x},${z}`;

const corridorPath=[
  [0,-12],
  [0,5],
  [5,5],
  [5,10],
  [0,10],
  [0,24]
];

function addHallRectangle(minX,maxX,minZ,maxZ){
  for(let x=Math.round(minX/HALL_CELL);x<Math.round(maxX/HALL_CELL);x++){
    for(let z=Math.round(minZ/HALL_CELL);z<Math.round(maxZ/HALL_CELL);z++){
      hallCells.add(hallKey(x,z));
    }
  }
}
for(let i=1;i<corridorPath.length;i++){
  const a=corridorPath[i-1],b=corridorPath[i];
  addHallRectangle(
    Math.min(a[0],b[0])-1,Math.max(a[0],b[0])+1,
    Math.min(a[1],b[1])-1,Math.max(a[1],b[1])+1
  );
}

const hallFloorParts=[],hallWallParts=[],hallTrimParts=[],hallCeilingParts=[];
function geometryBox(parts,w,h,d,x,y,z){
  const geometry=new THREE.BoxGeometry(w,h,d);
  geometry.translate(x,y,z);
  parts.push(geometry);
}
for(const key of hallCells){
  const [ix,iz]=key.split(',').map(Number);
  const x=(ix+.5)*HALL_CELL,z=(iz+.5)*HALL_CELL;
  geometryBox(hallFloorParts,HALL_CELL,.12,HALL_CELL,x,-.06,z);
  geometryBox(hallCeilingParts,HALL_CELL,.08,HALL_CELL,x,3.18,z);

  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
    if(hallCells.has(hallKey(ix+dx,iz+dz)))continue;
    const bx=x+dx*HALL_CELL/2;
    const bz=z+dz*HALL_CELL/2;

    // 区間端は開けたまま。プレイヤーは端より手前で巻き戻される。
    if(dz!==0 && (bz<=-12.9 || bz>=24.9))continue;

    const width=dx===0?HALL_CELL:.10;
    const depth=dx===0?.10:HALL_CELL;
    const isDoor=dx===-1 && Math.abs(bx+1)<.001 &&
      z>-.5 && z<.5;
    if(isDoor){
      geometryBox(hallWallParts,width,.78,depth,bx,2.75,bz);
    }else{
      geometryBox(hallWallParts,width,3.14,depth,bx,1.57,bz);
      geometryBox(hallTrimParts,
        dx===0?HALL_CELL:.13,.13,
        dx===0?.13:HALL_CELL,bx,.065,bz);
    }
  }
}
function finishMerged(parts,mat,parent){
  const geometry=mergeGeometries(parts,false);
  for(const part of parts)part.dispose();
  return mesh(geometry,mat,parent);
}
const hallFloorMaterial=material('#bdac8b',.64,0,{

});

function refreshRoomPreview(){
  corridorRoomPreview.clear();
  scene.updateMatrixWorld(true);
  scene.traverse(object=>{
    if(!object.isMesh && !object.isLineSegments && !object.isPoints)return;
    if(!hierarchyVisible(object))return;
    for(let parent=object;parent;parent=parent.parent){
      if(parent===roomCorridorPreview || parent===roomDoorLeaf)return;
    }
    const copy=object.clone(false);
    copy.userData={};
    copy.matrixAutoUpdate=false;
    copy.matrix.copy(object.matrixWorld);
    corridorRoomPreview.add(copy);
  });
}

function isHallFloorAt(x,z){
  return hallCells.has(hallKey(
    Math.floor(x/HALL_CELL),
    Math.floor(z/HALL_CELL)
  ));
}

function canWalkCorridor(x,z,eyeY){
  // 壁の開口から、室内へ切り替わる位置までは通行可能。
  const throat=doorOpen && roomDoorLeaf.rotation.y>1.05 &&
    x> -1.55 && x<-.65 &&
    Math.abs(z)<.5-playerRadius-.025;
  if(!throat){
    // プレイヤーの円と、周囲の「床でないセル」の交差を調べる。
    const minX=Math.floor((x-playerRadius)/HALL_CELL);
    const maxX=Math.floor((x+playerRadius)/HALL_CELL);
    const minZ=Math.floor((z-playerRadius)/HALL_CELL);
    const maxZ=Math.floor((z+playerRadius)/HALL_CELL);
    for(let ix=minX;ix<=maxX;ix++){
      for(let iz=minZ;iz<=maxZ;iz++){
        if(hallCells.has(hallKey(ix,iz)))continue;
        if(circleIntersectsBox(x,z,{
          minX:ix*HALL_CELL,maxX:(ix+1)*HALL_CELL,
          minZ:iz*HALL_CELL,maxZ:(iz+1)*HALL_CELL
        }))return false;
      }
    }
    if(!isHallFloorAt(x,z))return false;
  }
  if(collidesWithDoorPanel(hallwayDoorPanel,x,z,eyeY))return false;
  return true;
}

function setAreaHUD(){
  $('#hud h1').textContent=mode==='corridor'
    ? '折り返す廊下'

  $('#help').textContent=mode==='corridor'
    ? 'WASD：移動 ／ ドラッグ：見回す ／ ドアをクリックして入室'
    : 'WASD：移動 ／ ドラッグ：見回す ／ クリック：調べる ／ 下：視点移動';
  document.querySelectorAll('#nav button').forEach(button=>{

  });
}

function updateAreaCrossing(){
  if(mode==='room' && camera.position.x>4.12){
    // 室内の右壁から、廊下の左壁へ。
    refreshRoomPreview();
    camera.position.x-=5;
    camera.position.z-=2.5;
    mode='corridor';
    corridorRoomIndex=activeRoomIndex;
    currentView='room';
    camera.position.y=1.64;
    cameraTravel=null;
    updateRoomNumber();
    setAreaHUD();
    toast('左右に廊下が続いている。右へ進むと、左・右と折れる曲がり角がある。',4200);
    return;
  }

  if(mode!=='corridor')return;

  let nextIndex=corridorRoomIndex;
  if(camera.position.z>22){
    camera.position.z-=HALL_PERIOD;
    nextIndex=(corridorRoomIndex+1)%ROOM_COUNT;
  }else if(camera.position.z< -10){
    camera.position.z+=HALL_PERIOD;
    nextIndex=(corridorRoomIndex+ROOM_COUNT-1)%ROOM_COUNT;
  }

  if(nextIndex!==corridorRoomIndex){
    corridorRoomIndex=nextIndex;
    activeRoomIndex=nextIndex;
    applyRoomLayout(nextIndex);
    updateRoomNumber();
    refreshRoomPreview();
    // レイキャスト用の行列も、描画前に更新する。
    corridorScene.updateMatrixWorld(true);
  }

  if(camera.position.x< -1.15 && Math.abs(camera.position.z)<.5){
    camera.position.x+=5;
    camera.position.z+=2.5;
    camera.position.y=1.64;
    mode='room';
    activeRoomIndex=corridorRoomIndex;
    currentView='room';
    cameraTravel=null;
    setAreaHUD();
    toast(
      `部屋 ${String(activeRoomIndex+1).padStart(2,'0')}。同じ部屋なのに、家具の場所が少し違う。`,
      3500
    );
  }
}

// レイキャスト。手前の非操作物は遮蔽物として扱う。
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
function hierarchyVisible(obj){
  for(let o=obj;o;o=o.parent) if(!o.visible)return false;
  return true;
}
function pick(clientX,clientY){
  pointer.set(clientX/innerWidth*2-1,-clientY/innerHeight*2+1);
  raycaster.setFromCamera(pointer,mode==='inspect'?inspectCamera:camera);
  const activeScene=mode==='inspect'?inspectScene:
    mode==='corridor'?corridorScene:scene;
  activeScene.updateMatrixWorld(true);
  const hits=raycaster.intersectObjects(
    activeScene.children,true
  ).filter(h=>h.object.isMesh && hierarchyVisible(h.object));
  if(!hits.length)return null;
  for(let o=hits[0].object;o;o=o.parent){
    if(o.userData.action)return o;
  }
  return null;
}
let down=null,dragging=false,hovered=null;
let lastPointer={x:innerWidth/2,y:innerHeight/2};
const touches=new Map();
let pinchDistance=0;
function zoomInspect(factor){
  const z=clamp(inspectCamera.position.z*factor,1.3,4.5);
  inspectCamera.position.z=z;
  inspectCamera.lookAt(0,.43,0);
}
renderer.domElement.addEventListener('pointerdown',e=>{
  if(paperVisible||$('#win').style.display==='grid')return;
  renderer.domElement.setPointerCapture(e.pointerId);
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2){
    const a=[...touches.values()];
    pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    dragging=true;return;
  }
  down={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,id:e.pointerId};
  dragging=false;
});
renderer.domElement.addEventListener('pointermove',e=>{
  lastPointer={x:e.clientX,y:e.clientY};
  if(touches.has(e.pointerId))touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touches.size===2 && mode==='inspect'){
    const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchDistance>0 && d>0)zoomInspect(pinchDistance/d);
    pinchDistance=d;return;
  }
  if(!down || down.id!==e.pointerId)return;
  const dx=e.clientX-down.lx,dy=e.clientY-down.ly;
  if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragging=true;
  if(dragging){
    if(mode==='inspect'){
      inspectPivot.rotation.y+=dx*.008;
      inspectPivot.rotation.x+=dy*.007;
    }else{
      cameraTravel=null;
      yaw-=dx*.0038;
      pitch=clamp(pitch-dy*.0038,currentView==='under'?-.43:-1.22,
        currentView==='under'?.46:1.25);
      applyLook();
    }
  }
  down.lx=e.clientX;down.ly=e.clientY;
});
renderer.domElement.addEventListener('pointerup',e=>{
  touches.delete(e.pointerId);pinchDistance=0;
  if(down && !dragging && !paperVisible){
    const obj=pick(e.clientX,e.clientY);
    obj?.userData.action();
  }
  down=null;dragging=false;
});
renderer.domElement.addEventListener('pointercancel',()=>{
  down=null;dragging=false;touches.clear();
});
renderer.domElement.addEventListener('wheel',e=>{
  if(mode==='inspect'){e.preventDefault();zoomInspect(Math.exp(e.deltaY*.001));}
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(paperVisible)$('#closePaper').click();
    else if($('#win').style.display==='grid')$('#continue').click();
    else if(mode==='inspect')exitInspect();
    else if(currentView==='under')gotoView('bed');

});

// 少量の空中の埃。窓際の光にだけ、ほのかに見える。
const motesGeometry=new THREE.BufferGeometry();
const motesPosition=new Float32Array(90*3);
for(let i=0;i<90;i++){
  motesPosition[i*3]=-3.6+random()*3.2;

const warmWhite=new THREE.Color('#fff0d3');
const afterglow=new THREE.Color('#ffb679');
const clock=new THREE.Clock();
let hoverAge=0;

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  time+=dt;updateTweens(dt);

  if(cameraTravel && mode==='room'){
    const a=cameraTravel;
    a.t+=dt;
    const t=Math.min(1,a.t/a.duration);
    const e=t*t*(3-2*t);
    camera.position.lerpVectors(a.start,a.end,e);
    yaw=lerp(a.yaw0,a.yaw1,e);pitch=lerp(a.pitch0,a.pitch1,e);
    applyLook();
    if(t===1)cameraTravel=null;
  }

  if(hallwayDoorLeaf){
    hallwayDoorLeaf.rotation.y=roomDoorLeaf.rotation.y;
  }
  updateWalking(dt);

  // 点灯は速い。消灯は先に暖色へ寄り、その後に減衰。
  if(roomLightOn){
    lightAmount=lerp(lightAmount,1,1-Math.exp(-dt*31));
    mainLight.color.lerp(warmWhite,1-Math.exp(-dt*24));
  }else{
    lightOffAge+=dt;
    if(lightOffAge<.15){
      // 一瞬だけ部屋全体に残る、淡い暖色の光。
      lightAmount=lerp(lightAmount,.78,1-Math.exp(-dt*18));
      mainLight.color.lerp(afterglow,1-Math.exp(-dt*28));
    }else{
      lightAmount*=Math.exp(-dt*2.65);
      mainLight.color.lerp(afterglow,1-Math.exp(-dt*7));
      if(lightAmount<.001)lightAmount=0;
    }
  }
  mainLight.intensity=38*lightAmount;
  diffuserMat.emissive.copy(mainLight.color);
  diffuserMat.emissiveIntensity=lightAmount*1.8;
  scene.environmentIntensity=.025+.175*lightAmount;
  fillLight.intensity=.105+.125*lightAmount;
  previewRoomLight.intensity=38*lightAmount;
  previewRoomLight.color.copy(mainLight.color);

  // カーテンの縦ひだ + 低周波の揺れ + 小さな不規則なうねり。
  for(const {m,base,side} of curtains){
    const p=m.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      const x=base[i*3],y=base[i*3+1];
      const bottom=clamp((1.19-y)/2.38,0,1);
      const folds=.060*Math.cos(x*45)+.018*Math.cos(x*91+.3);
      const gust=
        Math.sin(time*.73+side*1.7)*.020+
        Math.sin(time*1.17+x*3+side)*.013+
        Math.sin(time*.31+2.2)*.014;
      const flutter=Math.sin(time*1.8+x*9-y*2.4+side)*.009;
      p.setXYZ(i,
        x+Math.pow(bottom,1.7)*.012*Math.sin(time*.84+y*2+side),
        y+bottom*.006*Math.sin(time*1.2+x*7),
        folds+(gust+flutter)*Math.pow(bottom,1.3)
      );
    }
    p.needsUpdate=true;m.geometry.computeVertexNormals();
  }

  const mp=motesGeometry.attributes.position;
  for(let i=0;i<mp.count;i++){
    mp.array[i*3]+=.0015*Math.sin(time*.3+i)*dt;
    mp.array[i*3+1]+=.004*Math.sin(time*.4+i*2)*dt;
  }
  mp.needsUpdate=true;

  hoverAge+=dt;
  if(hoverAge>.09 && !down && !paperVisible){
    hoverAge=0;
    hovered=pick(lastPointer.x,lastPointer.y);
    renderer.domElement.style.cursor=hovered?'pointer':'grab';
    $('#tip').textContent=hovered?.userData.label||'';
    $('#tip').style.opacity=hovered?'1':'0';
  }
  renderer.render(
    mode==='inspect'?inspectScene:mode==='corridor'?corridorScene:scene,
    mode==='inspect'?inspectCamera:camera
  );
}
addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=inspectCamera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();inspectCamera.updateProjectionMatrix();
});

// 最初のフレームを描画してから、ロード表示を外す。
renderer.render(scene,camera);
$('#loading').style.display='none';
toast('小物をどかしたり、扉を開けたりしてみよう。低いところも忘れずに。',4800);
tick();
</script>
</body>
